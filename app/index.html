<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Avaliação Postural">
<meta name="theme-color" content="#1f5f99">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Avaliação Postural</title>
<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --ink: #18212b; --muted: #5d6b7a; --line: #d9e0e8;
  --brand: #1f5f99; --brand-ink: #ffffff; --accent: #e8890c; --ok: #2e7d4f; --warn: #b54708; --bad: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --card: #1a222b; --ink: #e8edf2; --muted: #9aa8b6; --line: #2c3742;
    --brand: #4b8fd1; --brand-ink: #0b1218; --accent: #f0a23a; --ok: #5cc28a; --warn: #f0a23a; --bad: #f07a6e;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header.top { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: var(--brand); color: var(--brand-ink); }
header.top h1 { font-size: 18px; margin: 0; flex: 1; }
header.top button { background: transparent; color: var(--brand-ink); border: 1px solid currentColor; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
h2 { font-size: 20px; margin: 0 0 12px; } h3 { font-size: 17px; margin: 16px 0 8px; }
button, .btn { font: inherit; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; min-height: 40px; }
button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
button.danger { color: var(--bad); }
button.on { background: var(--accent); border-color: var(--accent); color: #111; }
button:disabled { opacity: .5; }
input, select, textarea { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
textarea { min-height: 70px; }
label { display: block; font-size: 14px; color: var(--muted); margin: 8px 0 3px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 12px; }
.muted { color: var(--muted); font-size: 14px; }
.warn { color: var(--warn); font-size: 14px; }
.list a { display: block; padding: 12px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.list a:last-child { border-bottom: 0; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
.tabs button { white-space: nowrap; }
.editor { display: grid; grid-template-columns: 1fr 300px; gap: 12px; }
@media (max-width: 820px) { .editor { grid-template-columns: 1fr; } }
.stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; touch-action: none; }
.stage canvas { display: block; width: 100%; touch-action: none; }
.stage .empty { color: #ddd; padding: 40px 16px; text-align: center; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.pts { max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.pts div { padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: center; }
.pts div.sel { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.pts .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
.pts .done .dot { background: var(--brand); border-color: var(--brand); }
.pts small { color: var(--muted); display: block; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); }
.tag.out { border-color: var(--warn); color: var(--warn); }
.tag.in { border-color: var(--ok); color: var(--ok); }
.table-wrap { overflow-x: auto; }
#report { display: none; }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; color: #000; }
  header.top, main, .brand, #lock, #cam-overlay { display: none !important; }
  #report { display: block !important; }
}
/* Guia do ponto */
.stagewrap { position: relative; }
.guide { position: absolute; z-index: 3; top: 8px; right: 8px; width: 176px; background: color-mix(in srgb, var(--card) 94%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 6px; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.guide[hidden] { display: none; }
.guide .g-fig svg { width: 100%; height: auto; display: block; border-radius: 6px; }
.guide .g-txt { font-size: 12px; line-height: 1.3; }
.guide .g-txt b { display: block; font-size: 13px; }
.guide .g-txt span { display: block; color: var(--muted); }
.guide .g-txt .g-side { color: var(--accent); font-weight: 600; }
.guide .g-txt .g-note { font-size: 10px; opacity: .8; margin-top: 2px; }
@media (max-width: 560px) { .guide { width: 124px; } }
[hidden] { display: none !important; }
/* Trava por PIN */
#lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
#lock .lockbox { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: min(360px, 100%); text-align: center; }
/* Câmera guiada */
#cam-overlay { position: fixed; inset: 0; z-index: 90; background: #000; }
#cam-overlay video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
#cam-overlay #cam-grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#cam-level { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 99px; font-weight: 600; background: rgba(0,0,0,.6); color: #fff; }
#cam-level.ok { background: #1b8a3b; } #cam-level.bad { background: #b54708; }
#cam-msg { position: absolute; left: 12px; right: 12px; bottom: 96px; text-align: center; color: #fff; font-size: 14px; text-shadow: 0 1px 3px #000; }
#cam-btns { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 14px; justify-content: center; }
#cam-btns button { min-width: 130px; min-height: 54px; font-size: 18px; }
.mini { min-height: 28px; padding: 2px 9px; line-height: 1; font-size: 16px; color: var(--bad); flex: none; }
.nudge { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; justify-content: start; align-items: center; margin-top: 6px; }
.nudge button { min-height: 52px; font-size: 20px; padding: 0; touch-action: manipulation; }
/* Página da vista */
.viewpage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: 16px; align-items: start; }
@media (max-width: 820px) { .viewpage { grid-template-columns: 1fr; } }
.vp-photo { text-align: center; }
.vp-photo canvas { max-width: 100%; border-radius: 10px; background: #000; display: block; margin: 0 auto; }
.vp-empty { padding: 60px 16px; color: var(--muted); }
.vp-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.vp-big { min-height: 54px; font-size: 18px; }
/* Tela cheia (marcação, calibração, corte e ângulos livres) */
.fs { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; background: #000; height: 100vh; height: 100dvh; }
.fs-head { background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); padding-left: max(12px, env(safe-area-inset-left)); flex: none; }
.fs-x { background: transparent; border: 0; color: inherit; min-height: 44px; width: 44px; padding: 8px; }
.fs-x svg { width: 26px; height: 26px; }
.fs-title { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.fs-title b { font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fs-sub { font-size: 13px; opacity: .85; }
.fs-area { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; touch-action: none; }
.fs-cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.fs-left, .fs-right { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 5; }
.fs-left { left: max(10px, env(safe-area-inset-left)); }
.fs-right { right: max(10px, env(safe-area-inset-right)); }
.fs-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #fff; color: #1f5f99; border: 0; border-radius: 14px; min-width: 62px; min-height: 62px; padding: 6px 8px; box-shadow: 0 2px 8px rgba(0,0,0,.35); font-size: 11px; font-weight: 600; touch-action: manipulation; }
.fs-btn svg { width: 26px; height: 26px; }
.fs-btn.on { background: #ffd60a; color: #111; }
.fs-btn.primary { background: #1f78d1; color: #fff; }
.fs-bottom { background: #111; display: flex; gap: 12px; justify-content: center; align-items: center; padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); flex: none; }
.fs-bottom .fs-btn { min-width: 84px; min-height: 64px; }
.fs-toast { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); max-width: 80%; background: rgba(0,0,0,.8); color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 14px; text-align: center; z-index: 9; pointer-events: none; }
.fs-pill { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 330px); background: rgba(0,0,0,.65); color: #fff; padding: 8px 14px; border-radius: 99px; font-size: 14px; text-align: center; z-index: 4; pointer-events: none; }
.fs-drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 92%); background: var(--card); color: var(--ink); z-index: 8; padding: 12px; overflow: auto; box-shadow: -4px 0 14px rgba(0,0,0,.4); }
.fs-modal { position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
.fs-modal .box { background: var(--card); color: var(--ink); border-radius: 14px; padding: 16px; width: min(380px, 100%); }
.fs-modal .col { display: flex; flex-direction: column; gap: 8px; }
.fs-modal .col button small { display: block; color: var(--muted); font-weight: 400; }
.fs-nudge { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 6; background: rgba(0,0,0,.6); border-radius: 14px; padding: 8px; }
.fs-nudge .nudge { margin-top: 0; }
.fs-nudge .nudge button, .fs-nudge .nudge select { background: #fff; color: #111; }
.mk-guide { position: absolute; top: 10px; right: max(10px, env(safe-area-inset-right)); width: 132px; height: 132px; border-radius: 12px; overflow: hidden; background: #ddd; box-shadow: 0 2px 8px rgba(0,0,0,.4); z-index: 6; cursor: pointer; }
.mk-guide svg { width: 100%; height: 100%; display: block; }
.mk-guide.big { width: min(260px, 55%); height: min(400px, 62%); }
.mk-guide .mk-help { position: absolute; top: 4px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.92); color: #111; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.mk-name { position: absolute; top: 152px; right: max(10px, env(safe-area-inset-right)); max-width: min(260px, 60%); background: #fff; color: #111; border: 2px solid #e53935; border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 18px; z-index: 6; pointer-events: none; }
.mk-name small { display: block; font-weight: 400; font-size: 12px; color: #444; }
.mk-name small.side { color: #b54708; font-weight: 600; }
.mk-name.low { top: auto; bottom: 14px; }
.dr-row { display: flex; width: 100%; text-align: left; gap: 8px; align-items: center; margin: 4px 0; }
.dr-row small { display: block; color: var(--muted); font-weight: 400; }
.dr-row.cur { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 25%, transparent); }
.dr-row .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
.dr-row.done .dot { background: var(--brand); border-color: var(--brand); }
.dr-card { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin: 8px 0; }
.dr-card.cur { border-color: var(--accent); }
.cal-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
.fs-bottom { flex-wrap: wrap; }
.cal-form label { color: #fff; font-size: 12px; margin: 0; }
.cal-form input { width: 90px; }
.cal-form select { width: auto; }
.crop-fine { color: #fff; min-width: 170px; }
.crop-fine label { color: #fff; margin: 0; display: flex; justify-content: space-between; }
.crop-fine input { padding: 0; }
@media (max-width: 700px) { .fs-pill { max-width: calc(100% - 20px); top: 148px; } .fs-bottom { gap: 6px; } .fs-bottom .fs-btn { min-width: 64px; } }
/* Início da avaliação */
.launch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.launch.small { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 700px) { .launch.small { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.lcard { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; min-height: 170px; padding: 16px; border-radius: 22px; background: var(--card); color: var(--ink); box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.launch.small .lcard { min-height: 110px; }
.lcard b { font-size: 20px; }
.launch.small .lcard b { font-size: 16px; }
.lcard small { color: var(--muted); font-weight: 400; font-size: 13px; }
.lcard .lic { color: var(--brand); display: block; }
.lcard .lic svg { width: 64px; height: 64px; }
.launch.small .lic svg { width: 40px; height: 40px; }
.sheet { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet .box { background: var(--card); color: var(--ink); border-radius: 16px; padding: 18px; width: min(420px, 100%); max-height: 90vh; overflow: auto; }
.sheet .col { display: flex; flex-direction: column; gap: 8px; }
.sheet .col small { display: block; color: var(--muted); font-weight: 400; }
.fs-types { position: absolute; top: 12px; right: max(10px, env(safe-area-inset-right)); display: flex; flex-direction: column; gap: 10px; align-items: flex-end; z-index: 6; }
.fs-type { width: 64px; height: 64px; border-radius: 50%; background: #8e8e93; color: #fff; border: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.35); padding: 0; }
.fs-type svg { width: 36px; height: 36px; }
.fs-type.on { background: #34c759; }
.fs-done { background: #ff9500; color: #fff; border: 0; border-radius: 99px; min-height: 54px; padding: 0 26px; font-size: 20px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.fs-right.low { top: auto; bottom: 14px; transform: none; }
@media (max-height: 560px) { .fs-type { width: 46px; height: 46px; } .fs-type svg { width: 26px; height: 26px; } .fs-done { min-height: 42px; font-size: 16px; padding: 0 16px; } .fs-types { gap: 6px; } }
/* Testes de movimento */
details.card > summary { cursor: pointer; font-size: 17px; }
.mv-chk { display: flex; gap: 8px; align-items: flex-start; color: var(--ink); font-size: 15px; margin: 6px 0; }
.mv-chk input { width: auto; margin-top: 4px; }
.mv-bi { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 6px 0; font-size: 15px; }
.mv-bi > span { flex: 1; min-width: 180px; }
.mv-bi label { display: flex; gap: 4px; align-items: center; margin: 0; color: var(--ink); }
.mv-bi input { width: auto; }
/* Marca */
.brand { display: flex; align-items: center; gap: 14px; justify-content: center; flex-wrap: wrap; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
.brand img { height: 56px; width: auto; display: block; }
.brand .sep { width: 1px; align-self: stretch; background: #d9e0e8; }
/* Laudo */
.rp .brandbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.rp .brandbar img { height: 20mm; width: auto; }
.rp .cred { border: 1px solid #bbb; padding: 6px 10px; font-size: 9.5pt; page-break-inside: avoid; }
.rp .cred .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rp .cred ul { margin: 2px 0 4px 16px; padding: 0; }
.rp { color: #000; background: #fff; font-size: 11pt; }
.rp h1 { font-size: 18pt; margin: 0; color: #1f5f99; }
.rp h2 { font-size: 13pt; background: #e7eef6; padding: 4px 8px; margin: 14px 0 8px; color: #13406b; }
.rp .page { page-break-after: always; }
.rp .page:last-child { page-break-after: auto; }
.rp .head { display: flex; justify-content: space-between; border-bottom: 2px solid #1f5f99; padding-bottom: 6px; margin-bottom: 8px; }
.rp .view { display: grid; grid-template-columns: 42% 58%; gap: 10px; align-items: start; }
.rp .view img.full { width: 100%; max-height: 118mm; object-fit: contain; border: 1px solid #ccc; }
.rp table { font-size: 9.5pt; }
.rp th, .rp td { border: 1px solid #bbb; padding: 3px 5px; }
.rp th { background: #fde9c9; color: #000; }
.rp .crops { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
.rp .crop { border: 1px solid #bbb; font-size: 8.5pt; page-break-inside: avoid; }
.rp .crop img { width: 100%; display: block; }
.rp .crop div { padding: 2px 4px; }
.rp .note { font-size: 9pt; color: #333; }
.rp .screen-only { margin-bottom: 12px; }
@media print { .rp .screen-only { display: none; } }
</style>
</head>
<body>
<header class="top">
  <button id="nav-back" hidden>‹ Voltar</button>
  <h1 id="title">Avaliação Postural</h1>
  <button id="nav-refs">Referências</button>
  <button id="nav-backup">Cópia de segurança</button>
  <button id="nav-sec">Segurança</button>
</header>
<div class="brand"><img src="logo-ct.png" alt="CT Pedro Bispo"><span class="sep"></span><img src="logo-correplus.webp" alt="Corre+ Assessoria para Corredores"></div>
<main id="main"></main>
<div id="report"></div>
<div id="lock" hidden></div>
<div id="cam-overlay" hidden></div>
<script src="angles.js"></script>
<script src="guide.js"></script>
<script src="movimento.js"></script>
<script src="report.js"></script>
<script src="app.js"></script>
</body>
</html>
